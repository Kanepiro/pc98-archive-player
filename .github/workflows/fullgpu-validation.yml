name: Full GPU Windows validation
on:
  push:
    branches: [work/fullgpu-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tensorflow-cpu==2.19.1 tf2onnx==1.16.1 numpy==1.26.4
      - run: python native-boost/build_vision_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: Source-models-for-DirectML
          path: |
            native-boost/models/*-directml.onnx
            native-boost/models/metadata.json
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile native shaders and applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native-boost -B gpu-build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake failed' }
          cmake --build gpu-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          Copy-Item native-boost/*.hlsl gpu-build/Release/
          & gpu-build/Release/fullgpu_layout.exe --check-shader
          if ($LASTEXITCODE -ne 0) { throw 'HLSL compilation failed' }
          & gpu-build/Release/fullgpu_contour.exe --check-shader
          if ($LASTEXITCODE -ne 0) { throw 'Contour HLSL compilation failed' }
      - name: Verify native shader execution using explicit software test adapter
        shell: pwsh
        run: |
          $env:TASL_TEST_WARP = '1'
          & gpu-build/Release/fullgpu_layout.exe --probe
          if ($LASTEXITCODE -ne 0) { throw 'WARP initialization failed' }
      - name: Run independent original-critic regression
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed' }
          Copy-Item gpu-build/Release/*.exe native-boost/
          $env:TASL_TEST_WARP = '1'
          $env:TASL_NO_BROWSER = '1'
          $env:TASL_BOOST_PORT = '39085'
          $env:BOOST_URL = 'http://127.0.0.1:39085/'
          $p = Start-Process python -ArgumentList 'native-boost/bridge.py' -PassThru -RedirectStandardError gpu-server.log
          try {
            Start-Sleep -Seconds 3
            node tests/fullgpu-layout.browser.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Native layout regression failed' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Verify native GPU detection postprocessing
        shell: pwsh
        run: |
          pip install numpy==1.26.4 opencv-python-headless==4.11.0.86
          python tests/nms-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU NMS regression failed' }
      - name: Verify GPU raster against original Windows GDI
        shell: pwsh
        run: |
          python tests/raster-parity.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU raster parity failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FullGPU-internal-validation
          path: |
            gpu-build/Release/
            gpu-validation/
            gpu-server.log
          retention-days: 7
