name: PC Native Boost (Windows x64)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-boost/**'
      - 'public/**'
      - 'tests/pc-boost.browser.mjs'
      - '.github/workflows/pc-native-boost.yml'
  push:
    branches: [main]
    tags: ['pc-boost-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled PC-98 Archive Player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'dist/index.html')) { throw 'Web player build failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Web player tests failed' }
      - name: Build native C++ converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native-boost -B boost-build -A x64
          cmake --build boost-build --config Release --parallel 2
      - name: Fetch Windows FFmpeg essentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin to FFmpeg 8.1.2; 9.x NVENC headers require API 13.1, breaking GTX 1050 Ti / Pascal.
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip' -OutFile 'ffmpeg.zip'
          $expected = 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec'
          $actual = (Get-FileHash 'ffmpeg.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'FFmpeg 8.1.2 checksum mismatch' }
          Expand-Archive -Path 'ffmpeg.zip' -DestinationPath 'ffmpeg-unpacked'
          $ffmpeg = Get-ChildItem ffmpeg-unpacked -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-unpacked -Recurse -File -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Missing FFmpeg/FFprobe' }
          New-Item -Type Directory -Force -Path 'pc-boost-package' | Out-Null
          Copy-Item $ffmpeg.FullName 'pc-boost-package/ffmpeg.exe'
          Copy-Item $ffprobe.FullName 'pc-boost-package/ffprobe.exe'
          $lic = Get-ChildItem ffmpeg-unpacked -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)' } | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName 'pc-boost-package/FFMPEG_LICENSE.txt' }
      - name: Test Windows native TSL, stop/resume and output validation
        shell: pwsh
        run: |
          Copy-Item 'boost-build/Release/tsl_boost.exe' 'native-boost/tsl_boost.exe'
          Copy-Item 'pc-boost-package/ffmpeg.exe' 'native-boost/ffmpeg.exe'
          Copy-Item 'pc-boost-package/ffprobe.exe' 'native-boost/ffprobe.exe'
          python native-boost/test_native.py
          python native-boost/test_resume.py
      - name: Build one-click portable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --clean --onefile --name TASL-PC-Boost --distpath boost-py-dist --workpath boost-py-build --specpath boost-spec native-boost/bridge.py
          Copy-Item 'boost-py-dist/TASL-PC-Boost.exe' 'pc-boost-package/TASL-PC-Boost.exe'
          Copy-Item 'boost-build/Release/tsl_boost.exe' 'pc-boost-package/tsl_boost.exe'
          Copy-Item 'boost-build/Release/tsl_render.exe' 'pc-boost-package/tsl_render.exe'
          Copy-Item -Path 'dist' -Destination 'pc-boost-package/app' -Recurse
          Copy-Item 'native-boost/README.md' 'pc-boost-package/README.md'
          Copy-Item 'native-boost/FFMPEG_NOTICE.txt' 'pc-boost-package/FFMPEG_NOTICE.txt'
          Copy-Item 'LICENSE' 'pc-boost-package/TASL_LICENSE.txt'
      - name: Browser-to-C++ end-to-end on actual Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TASL_NO_BROWSER = '1'
          $process = Start-Process -FilePath (Resolve-Path 'pc-boost-package/TASL-PC-Boost.exe') -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($attempt=0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:39083/health' -TimeoutSec 2
                if ($health.native -and $health.ffmpeg -and $health.ffprobe) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw 'Portable TASL-PC-Boost.exe failed to start' }
            $env:BOOST_UI_URL = 'http://127.0.0.1:39083/'
            $env:FFMPEG_BIN = (Resolve-Path 'pc-boost-package/ffmpeg.exe').Path
            $env:FFPROBE_BIN = (Resolve-Path 'pc-boost-package/ffprobe.exe').Path
            $env:EXPECT_CPU_FALLBACK = '1'
            node tests/pc-boost.browser.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Chrome TSL E2E failed' }
            node tests/pc-boost-mp4.browser.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Chrome native MP4 and audio E2E failed' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: ZIP the complete portable app
        shell: pwsh
        run: |
          Compress-Archive -Path 'pc-boost-package/*' -DestinationPath 'TASL-PC-Boost-Windows-x64.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: TASL-PC-Boost-Windows-x64
          path: TASL-PC-Boost-Windows-x64.zip
          retention-days: 30
